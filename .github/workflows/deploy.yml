name: Deploy

# Plan 6 Task 5. Push to main builds+pushes an arm64 image, deploys it to
# the shared Oracle VM, then syncs the Caddy site file. Fully
# self-bootstrapping — no manual first-time VM setup: the deploy job
# creates the app directory, writes .env from GitHub secrets, and sets
# up the backup cron on every run (all idempotent), so the very first
# real run is also the first deploy. The one thing this workflow
# genuinely cannot bootstrap is its own SSH access — SSH_PRIVATE_KEY's
# public half has to already be in the VM's deploy user's
# authorized_keys before this can run at all; that's a one-time action
# outside CI (already done — see repo secrets below).
#
# This project deploys under the `deploy` user's home directory,
# /home/deploy/justsayit — NOT /opt. /opt is where the *other* shared
# component on this VM, /opt/edge-proxy, lives; that's a separate
# pre-existing thing this project only ever reads/validates, never owns.
#
# `concurrency` prevents two pushes in quick succession from racing each
# other's deploy/Caddy-sync steps against the same shared VM.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/taoxiong05/justsayit
  APP_DIR: /home/deploy/justsayit

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Mandatory (Global Constraint 4) — GitHub's hosted runners are
      # amd64; without QEMU the build silently produces an amd64-only
      # manifest and `docker compose pull` on the arm64 VM fails with
      # "no matching manifest for linux/arm64/v8".
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/arm64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No manual first-time VM setup — every run syncs the compose file
      # and backup script fresh from the repo, so the very first deploy
      # bootstraps ${{ env.APP_DIR }} from nothing and every later
      # deploy picks up any change to either file automatically. Staged
      # in /tmp first, same reasoning as the Caddy sync below: never
      # give the transfer step itself write access to the app directory
      # directly.
      - name: Stage compose file and backup script on the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/docker-compose.yml,deploy/backup.sh"
          target: /tmp/justsayit-incoming
          strip_components: 1

      # Writes ${{ env.APP_DIR }}/.env fresh from GitHub secrets on
      # every run — GitHub secrets are the single source of truth for
      # these values, not whatever's already on the VM. Don't hand-edit
      # .env on the VM expecting it to stick; update the GitHub secret
      # and redeploy instead, or a future run will silently overwrite it.
      - name: Bootstrap the app directory and (re)deploy
        uses: appleboy/ssh-action@v1
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          REFRESH_TOKEN_ENCRYPTION_KEY: ${{ secrets.REFRESH_TOKEN_ENCRYPTION_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          AI_DAILY_QUOTA: ${{ vars.AI_DAILY_QUOTA }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GROQ_API_KEY,CEREBRAS_API_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,SESSION_SECRET,REFRESH_TOKEN_ENCRYPTION_KEY,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,AI_DAILY_QUOTA,APP_DIR
          script: |
            set -e

            mkdir -p "${APP_DIR}/backups"
            cp /tmp/justsayit-incoming/docker-compose.yml "${APP_DIR}/docker-compose.yml"
            cp /tmp/justsayit-incoming/backup.sh "${APP_DIR}/backup.sh"
            chmod +x "${APP_DIR}/backup.sh"

            cat > "${APP_DIR}/.env" <<ENVEOF
            GROQ_API_KEY=${GROQ_API_KEY}
            CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_REDIRECT_URI=https://justsayit.taoxiong.site/api/auth/callback
            SESSION_SECRET=${SESSION_SECRET}
            REFRESH_TOKEN_ENCRYPTION_KEY=${REFRESH_TOKEN_ENCRYPTION_KEY}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@justsayit-db:5432/${POSTGRES_DB}
            AI_DAILY_QUOTA=${AI_DAILY_QUOTA:-60}
            ENVEOF
            chmod 600 "${APP_DIR}/.env"

            # Idempotent — only appends the backup cron line if it isn't
            # already there, so redeploys don't pile up duplicate entries.
            CRON_LINE="0 3 * * * ${APP_DIR}/backup.sh >> ${APP_DIR}/backups/backup.log 2>&1"
            (crontab -l 2>/dev/null | grep -Fq "$CRON_LINE") || { (crontab -l 2>/dev/null; echo "$CRON_LINE") | crontab -; }

            # `edge` is owned by the existing edge-proxy stack — this
            # project only ever joins it, never creates it. Fail loudly
            # here instead of silently `docker network create`-ing a new
            # one that wouldn't match the real edge-proxy's network.
            docker network inspect edge >/dev/null 2>&1 || {
              echo "edge network not found on the VM — it should already exist (created by the edge-proxy stack), not something this workflow creates" >&2
              exit 1
            }

            cd "${APP_DIR}"
            docker compose pull
            docker compose up -d

  sync-caddy:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stage the one file in /tmp first rather than scp-ing straight
      # into /opt/edge-proxy/sites-enabled/ — keeps the transfer atomic
      # relative to the validate/commit/reload sequence below, and never
      # gives the transfer step itself write access to the shared
      # edge-proxy directory. /opt/edge-proxy is untouched by the path
      # change above — it's a separate, pre-existing shared component,
      # not part of this project's own /home/deploy/justsayit tree.
      - name: Copy Caddy site file to the VM (staged in /tmp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/justsayit.caddy
          target: /tmp
          strip_components: 1

      # Global Constraint 9: touches exactly one file in the shared
      # edge-proxy repo, validates before ever reloading, and rolls that
      # one file back on failure — must never risk another app's site.
      #
      # NOTE for whoever runs this the first time: the exact
      # `caddy validate`/`caddy reload` invocation below is copied from
      # the design spec's documented recipe (docs/superpowers/specs/
      # 2026-09-04-justsayit-design.md §12.3), not independently
      # re-verified against how the other three apps' own CI actually
      # does it on this VM. Confirm they match (or fix this step to
      # match whatever they really do) before relying on it — the whole
      # sync-caddy job is also untestable from a sandboxed dev
      # environment with no access to the real VM, unlike the Dockerfile
      # and compose file, which were verified end-to-end locally.
      - name: Validate, commit, reload (or roll back on failure)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET=/opt/edge-proxy/sites-enabled/justsayit.caddy
            HAD_FILE=0
            [ -f "$TARGET" ] && HAD_FILE=1
            cp /tmp/justsayit.caddy "$TARGET"

            if docker exec edge-proxy caddy validate --config /etc/caddy/Caddyfile; then
              cd /opt/edge-proxy
              if ! git diff --quiet -- sites-enabled/justsayit.caddy; then
                git add sites-enabled/justsayit.caddy
                git commit -m "Add/update justsayit site"
              fi
              docker exec edge-proxy caddy reload --config /etc/caddy/Caddyfile
            else
              echo "Caddy validation failed — rolling back justsayit.caddy" >&2
              cd /opt/edge-proxy
              if [ "$HAD_FILE" = "1" ]; then
                git checkout -- sites-enabled/justsayit.caddy
              else
                rm -f "$TARGET"
              fi
              exit 1
            fi
