# Plan 6 Task 4 — checked into the repo as a template. The VM's actual
# copy lives at /home/deploy/justsayit/docker-compose.yml (this project
# deploys under the `deploy` user's home directory, not /opt — /opt is
# where the *other* shared component on this VM, /opt/edge-proxy, lives,
# a separate pre-existing thing this project doesn't own). CI syncs this
# file fresh on every run (see .github/workflows/deploy.yml) rather than
# assuming it's already there from a manual setup step.
#
# No `ports:` on either service (Global Constraint 2) — /opt/edge-proxy
# owns host 80/443 exclusively; justsayit-web is reached only via the
# shared `edge` network, and justsayit-db only from justsayit-web over
# the `internal` network.

services:
  justsayit-web:
    image: ghcr.io/taoxiong05/justsayit:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      justsayit-db:
        condition: service_healthy
    networks:
      edge:
        aliases: [justsayit-web]
      internal: {}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  justsayit-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - justsayit-pg-data:/var/lib/postgresql/data
    networks:
      internal: {}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge:
    external: true
  internal: {}

volumes:
  justsayit-pg-data:
